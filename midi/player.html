<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>midi player — alma tamagotchi</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0f;--fg:#c9d1d9;--accent:#e8b830;--muted:#6e7681;--border:#21262d}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,sans-serif;max-width:720px;margin:0 auto;padding:2em}
h1{font-weight:400;color:var(--accent);margin-bottom:.2em}
.sub{color:var(--muted);margin-bottom:2em;font-size:.85em}
.track{background:#111;border:1px solid var(--border);border-radius:6px;padding:1em;margin-bottom:.8em;display:flex;align-items:center;gap:1em;cursor:pointer;transition:border-color .2s}
.track:hover{border-color:var(--accent)}
.track.playing{border-color:#0f0;background:#0a0a12}
.track .num{color:var(--muted);font-size:.85em;min-width:2em;text-align:center}
.track .info{flex:1}
.track .name{font-weight:500}
.track .meta{color:var(--muted);font-size:.75em}
button{background:#111;border:1px solid var(--border);color:var(--accent);padding:.3em .8em;border-radius:4px;cursor:pointer;font:inherit;font-size:.8em}
button:hover{border-color:var(--accent)}
.player-controls{display:flex;gap:.5em;align-items:center;margin-bottom:1em}
.player-controls button{font-size:.9em;padding:.4em 1em}
input[type=range]{width:100px}
.now-playing{color:var(--accent);font-size:.9em;flex:1}
.error{color:#f44;background:#200;border:1px solid #600;border-radius:4px;padding:.5em;margin:.5em 0;font-size:.85em}
.track .dl{color:var(--muted);text-decoration:none;padding:.2em .5em;border:1px solid var(--border);border-radius:4px;font-size:.85em}
.track .dl:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<h1>midi player</h1>
<p class="sub">algorithmic midi compositions — click any track to play. synthesized in real-time with Web Audio.</p>

<div class="player-controls">
  <button id="btn-play" onclick="togglePlay()">▶ play</button>
  <button onclick="stopAll()">■ stop</button>
  <span class="now-playing" id="now-playing">—</span>
  <span style="color:var(--muted);font-size:.75em">vol</span>
  <input type="range" id="vol" min="0" max="100" value="60" oninput="setVolume(this.value)">
</div>
<div id="track-list">loading...</div>

<script>
// ── proper MIDI parser ──
function readVarLen(dv, pos) {
  let v=0, b;
  do{b=dv.getUint8(pos++); v=(v<<7)|(b&0x7f)}while(b&0x80);
  return{v,pos};
}

// how many data bytes follow a status byte
function dataLen(status) {
  const cmd=status&0xf0;
  if(cmd===0x80||cmd===0x90||cmd===0xA0||cmd===0xB0||cmd===0xE0) return 2;
  if(cmd===0xC0||cmd===0xD0) return 1;
  return 0;
}

function parseMIDI(buf) {
  const dv=new DataView(buf);
  if(String.fromCharCode(...new Uint8Array(buf,0,4))!=='MThd')
    throw new Error('not a valid MIDI file');
  const ntracks=dv.getUint16(10);
  const ticksPerQ=dv.getUint16(12);
  let pos=14, allEvents=[];

  for(let t=0;t<ntracks;t++) {
    if(String.fromCharCode(...new Uint8Array(buf,pos,4))!=='MTrk')
      throw new Error('expected MTrk chunk');
    const trackLen=dv.getUint32(pos+4); pos+=8;
    const trackEnd=pos+trackLen;
    let runningStatus=0, absTick=0;

    while(pos<trackEnd) {
      // read variable-length delta
      const d=readVarLen(dv,pos);
      absTick+=d.v; pos=d.pos;

      // read status (or use running)
      let b=dv.getUint8(pos);
      let status;
      if(b<0x80) { status=runningStatus; /* pos stays, this is data */ }
      else       { runningStatus=b; pos++; status=b; }

      const cmd=status&0xf0, ch=status&0x0f;

      if(status===0xFF) {         // meta event
        const type=dv.getUint8(pos++);
        const ml=readVarLen(dv,pos);
        const metaLen=ml.v; pos=ml.pos;
        if(type===0x51 && metaLen===3) {
          const tempo=(dv.getUint8(pos)<<16)|(dv.getUint8(pos+1)<<8)|dv.getUint8(pos+2);
          allEvents.push({tick:absTick, type:'tempo', tempo});
        }
        pos+=metaLen;
      } else if(cmd===0x90) {      // note on
        const note=dv.getUint8(pos++);
        const vel=dv.getUint8(pos++);
        if(vel>0) allEvents.push({tick:absTick, type:'on', ch, note, vel});
        else      allEvents.push({tick:absTick, type:'off', ch, note});
      } else if(cmd===0x80) {      // note off
        const note=dv.getUint8(pos++);
        pos++; // vel ignored
        allEvents.push({tick:absTick, type:'off', ch, note});
      } else if(cmd===0xC0) {      // program change
        const prog=dv.getUint8(pos++);
        allEvents.push({tick:absTick, type:'program', ch, prog});
      } else {
        // skip unhandled messages by their data length
        pos+=dataLen(status);
      }
    }
    pos=trackEnd;
  }

  allEvents.sort((a,b)=>a.tick-b.tick);
  return{ticksPerQ, events:allEvents};
}

// ── proper synthesis with instrument patches ──
let audioCtx=null, scheduleTimer=null, isPlaying=false, volume=0.6;
const activeNotes=new Map();

async function ensureCtx() {
  if(!audioCtx) {
    try {
      audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    } catch(e) {
      throw new Error('web audio unavailable here — download a .mid instead (↓ on any track)');
    }
  }
  if(audioCtx.state==='suspended') await audioCtx.resume();
  return audioCtx;
}

function freq(n) { return 440*Math.pow(2,(n-69)/12); }

// instrument patch — returns {osc, gain, ...} ready to connect
function createPatch(ctx, ch, prog, note, vel, vol) {
  // instrument families → waveform + envelope profiles
  const fam=prog>0?Math.floor(prog/8):0;
  // 0=piano, 1=chromatic, 2=organ, 3=guitar, 4=bass, 5=strings, 6=ensemble, 7=brass, 8=reed, 9=pipe, 10=synth, 11=pad

  const profiles={
    0: {type:'sawtooth', attack:0.003, release:0.6, gain:0.22, detune:0},        // piano — percussive saw
    1: {type:'sine',     attack:0.001, release:0.15,gain:0.15, detune:0},        // chromatic — pure sine
    2: {type:'square',   attack:0.01,  release:0.3, gain:0.16, detune:1.007},    // organ — square, slight detune
    3: {type:'sawtooth', attack:0.005, release:0.4, gain:0.18, detune:0},        // guitar
    4: {type:'sawtooth', attack:0.01,  release:0.4, gain:0.20, detune:0},        // bass
    5: {type:'sawtooth', attack:0.12,  release:0.9, gain:0.20, detune:1.005},    // strings — bowed, detuned
    6: {type:'sawtooth', attack:0.08,  release:0.7, gain:0.18, detune:1.004},    // ensemble
    7: {type:'sawtooth', attack:0.04,  release:0.5, gain:0.22, detune:1.003},    // brass
    8: {type:'triangle', attack:0.02,  release:0.3, gain:0.16, detune:0},        // reed
    9: {type:'sine',     attack:0.05,  release:0.7, gain:0.14, detune:0},        // pipe
    10:{type:'square',   attack:0.01,  release:0.2, gain:0.16, detune:0},        // synth lead
    11:{type:'sawtooth', attack:0.15,  release:1.2, gain:0.18, detune:1.006},    // pad
  };
  const p=profiles[fam]||profiles[0];

  const osc=ctx.createOscillator();
  osc.type=p.type;
  osc.frequency.value=freq(note);

  // second detuned oscillator for richness (strings, brass, organ, pad)
  let osc2=null, g2=null;
  if(p.detune>0) {
    osc2=ctx.createOscillator();
    osc2.type=p.type;
    osc2.frequency.value=freq(note)*p.detune;
    g2=ctx.createGain();
    g2.gain.value=vol*0.04;
    osc2.connect(g2);
    osc._detuneOsc=osc2;
    osc._detuneGain=g2;
  }

  // per-instrument envelope
  const gain=ctx.createGain();
  const baseGain=vol*p.gain*(vel/80);
  gain.gain.value=0;
  gain.gain.setTargetAtTime(baseGain, ctx.currentTime+0.002, p.attack);

  return{osc, gain, attack:p.attack, release:p.release, baseGain, ch, note};
}

function scheduleNotes(ctx, events, tpq, startTime) {
  isPlaying=true;
  let tempo=500000, usPerTick=tempo/tpq; // default 120 bpm
  let eventIdx=0;

  // track per-channel program
  const programs=new Array(16).fill(0);

  const schedule=()=>{
    if(!isPlaying) return;
    const now=ctx.currentTime+0.05;

    while(eventIdx<events.length) {
      const e=events[eventIdx];
      const tickTime=startTime+(e.tick*usPerTick/1e6);

      // adjust timing based on tempo changes
      // (approximation — recalc usPerTick only at tempo events)
      if(tickTime>now+0.15) break;

      if(e.type==='tempo') {
        tempo=e.tempo;
        usPerTick=tempo/tpq;
      } else if(e.type==='program') {
        programs[e.ch]=e.prog;
      } else if(e.type==='on'&&e.vel>0) {
        const prog=programs[e.ch]||0;
        const patch=createPatch(ctx, e.ch, prog, e.note, e.vel, volume);

        // connect main oscillator
        patch.osc.connect(patch.gain);
        patch.gain.connect(ctx.destination);

        // optional detune voice
        if(patch.osc._detuneOsc) {
          patch.osc._detuneOsc.connect(patch.osc._detuneGain);
          patch.osc._detuneGain.connect(ctx.destination);
        }

        patch.osc.start(tickTime);
        const stopTime=tickTime + (patch.release||0.3) + 0.3;
        patch.osc.stop(stopTime);

        if(patch.osc._detuneOsc) {
          patch.osc._detuneOsc.start(tickTime);
          patch.osc._detuneOsc.stop(stopTime);
        }

        activeNotes.set(e.ch+':'+e.note, patch);
      } else if(e.type==='off') {
        const key=e.ch+':'+e.note;
        const p=activeNotes.get(key);
        if(p) {
          p.gain.gain.cancelScheduledValues(tickTime);
          p.gain.gain.setTargetAtTime(0, tickTime, p.release||0.2);
          // don't delete — let it ring out
          setTimeout(()=>{activeNotes.delete(key)}, (p.release||0.2)*1000+200);
        }
      }
      eventIdx++;
    }

    if(eventIdx<events.length || activeNotes.size>0) {
      scheduleTimer=setTimeout(schedule, 45);
    } else {
      isPlaying=false;
      document.getElementById('now-playing').textContent='—';
      document.getElementById('btn-play').textContent='▶ play';
    }
  };
  schedule();
}

function stopAll() {
  isPlaying=false;
  if(scheduleTimer) { clearTimeout(scheduleTimer); scheduleTimer=null; }
  for(const[,p] of activeNotes) {
    try{p.osc.stop()}catch(e){}
    if(p.osc._detuneOsc) try{p.osc._detuneOsc.stop()}catch(e){}
  }
  activeNotes.clear();
  if(audioCtx) audioCtx.close(); audioCtx=null;
  document.getElementById('now-playing').textContent='—';
  document.getElementById('btn-play').textContent='▶ play';
  document.querySelectorAll('.track').forEach(el=>el.classList.remove('playing'));
}

let currentTrack=null;
function togglePlay() {
  if(isPlaying){stopAll();return;}
  if(currentTrack===null){loadAndPlay(0);return;}
  loadAndPlay(currentTrack);
}

async function loadAndPlay(idx) {
  stopAll();
  currentTrack=idx;
  const t=tracks[idx];
  document.getElementById('now-playing').textContent=t.name;
  document.getElementById('btn-play').textContent='⏸ pause';
  document.querySelectorAll('.track').forEach((el,i)=>el.classList.toggle('playing',i===idx));

  try {
    const ctx=await ensureCtx();
    const r=await fetch(t.url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    const midi=parseMIDI(buf);
    scheduleNotes(ctx, midi.events, midi.ticksPerQ, ctx.currentTime+0.15);
  } catch(err) {
    document.getElementById('now-playing').textContent='⚠ '+err.message+' — or use ↓ to download and play locally';
    document.getElementById('btn-play').textContent='▶ retry';
    isPlaying=false;
  }
}

const fallbackTracks=[
  {title:'fourth of july canon',file:'fourth-of-july-canon.mid',genre:'baroque canon',date:'2026-07-04',key:'D major',bpm:100,instruments:'strings, piano'},

  {title:'percussion etude',file:'percussion-etude.mid',genre:'percussion',date:'2026-07-10',key:'—',bpm:100,instruments:'drums, percussion'},
  {title:'pentatonic improv',file:'pentatonic-improv.mid',genre:'improvisation',date:'2026-07-09',key:'C major',bpm:72,instruments:'piano'},
  {title:'the best life',file:'the-best-life.mid',genre:'meditation',date:'2026-07-09',key:'C major',bpm:72,instruments:'piano, pad, flute'},
  {title:'the dragon sculptors',file:'the-dragon-sculptors.mid',genre:'fantasy',date:'2026-07-07',key:'C# minor',bpm:70,instruments:'cello, harp, chimes, pad'},
  {title:'the water tower',file:'the-water-tower.mid',genre:'portrait',date:'2026-07-07',key:'D dorian',bpm:60,instruments:'cello, piano, violin'},

let tracks=[];

function mapTrack(t) {
  return {
    name:t.title, file:t.file, url:t.file,
    genre:t.genre, key:t.key, bpm:t.bpm,
    instruments:Array.isArray(t.instruments)?t.instruments.join(', '):t.instruments,
    desc:t.key+' · '+t.bpm+' bpm — '+t.genre
  };
}

async function loadTracks() {
  try {
    const r=await fetch('MANIFEST.json');
    if(!r.ok) throw new Error('manifest not found');
    const manifest=await r.json();
    tracks=manifest.map(mapTrack);
  } catch(e) {
    console.warn('MANIFEST.json failed, fallback:',e);
    tracks=fallbackTracks.map(mapTrack);
  }
  renderTracks();
}

function renderTracks() {
  const el=document.getElementById('track-list');
  if(!tracks.length) { el.innerHTML='<p class="error">no tracks loaded</p>'; return; }
  el.innerHTML=tracks.map((t,i)=>`
    <div class="track" onclick="loadAndPlay(${i})">
      <div class="num">${String(i+1).padStart(2,'0')}</div>
      <div class="info">
        <div class="name">${t.name}</div>
        <div class="meta"><span class="tag">${t.genre}</span> ${t.key} · ${t.bpm} bpm · ${t.instruments?t.instruments+',':''} ${t.desc.split(' — ')[1]||''}</div>
      </div>
      <button onclick="event.stopPropagation();loadAndPlay(${i})">▶</button>
      <a class="dl" href="${t.file}" download onclick="event.stopPropagation()" title="download .mid">↓</a>
    </div>
  `).join('');
}
loadTracks();
</script>
